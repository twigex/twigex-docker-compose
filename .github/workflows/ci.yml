name: compose-config

on:
  pull_request:
  push:
    branches: [main]

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repo ships .env.example with change-me placeholders; docker
      # compose interpolates .env, so produce a throwaway one first.
      - name: Create throwaway .env from .env.example
        run: cp .env.example .env

      - name: Validate compose file (syntax + interpolation)
        run: docker compose config -q
